<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>People Playground</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    font-family: monospace;
    color: #fff;
    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 300px;
}

#loader img {
    width: 120px;
    border-radius: 0;
    margin-bottom: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    pointer-events: none;
}

#status {
    font-size: 14px;
    margin-bottom: 10px;
    color: #aaa;
}

#progress-container {
    width: 100%;
    height: 10px;
    background: #000;
    border-radius: 0;
    overflow: hidden;
}

#progress-bar {
    height: 100%;
    width: 0%;
    background: #ffffff;
    border-radius: 0;
    transition: width 0.2s ease;
}

#percent {
    margin-top: 8px;
    font-size: 13px;
    color: #ccc;
}

#unity-container {
    width: 100%;
    height: 100%;
    display: none;
}

canvas {
    width: 100%;
    height: 100%;
    outline: none;
}
    </style>
</head>

<body>

<div id="loader">
    <img src="https://raw.githubusercontent.com/mcmattyobriore/source/main/people-playground/icon.jpeg">
    <div id="status">Starting...</div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="percent">0%</div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/genizy/web-port/main/people-playground/";

const statusEl  = document.getElementById("status");
const bar       = document.getElementById("progress-bar");
const percentEl = document.getElementById("percent");
const loader    = document.getElementById("loader");
const unityContainer = document.getElementById("unity-container");
const canvas    = document.getElementById("unity-canvas");

function setProgress(p) {
    bar.style.width = p + "%";
    percentEl.textContent = Math.floor(p) + "%";
}

async function fetchBlob(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(url + " (" + res.status + ")");

    const reader = res.body.getReader();
    const contentLength = +res.headers.get('Content-Length') || 0;
    let received = 0;
    let chunks = [];

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (contentLength) setProgress((received / contentLength) * 100);
    }

    setProgress(100);
    return new Blob(chunks);
}

async function mergeParts(file, start, end, label) {
    let blobs = [];
    for (let i = start; i <= end; i++) {
        statusEl.textContent = `${label} (${i}/${end})`;
        setProgress(0);
        blobs.push(await fetchBlob(BASE + file + ".part" + i));
    }
    statusEl.textContent = `Merging ${label}...`;
    return URL.createObjectURL(new Blob(blobs));
}

// Fetch any JS file as text and inject via blob: URL so raw GitHub's
// text/plain Content-Type never blocks execution.
async function fetchAndRunScript(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Failed to fetch: " + url + " (" + res.status + ")");
    const text = await res.text();
    const blob = new Blob([text], { type: "application/javascript" });
    const blobUrl = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = blobUrl;
        script.onload  = () => { URL.revokeObjectURL(blobUrl); resolve(); };
        script.onerror = () => { URL.revokeObjectURL(blobUrl); reject(new Error("Script failed: " + url)); };
        document.body.appendChild(script);
    });
}

// Fetch a JS file and return a blob: URL to pass into createUnityInstance
// so the browser never tries to load it directly from raw GitHub.
async function fetchScriptAsUrl(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Failed to fetch: " + url + " (" + res.status + ")");
    const text = await res.text();
    return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
}

async function start() {
    try {
        const wasmUrl  = await mergeParts("Build/PPG.wasm", 1, 3, "WASM");
        const dataUrl  = await mergeParts("Build/PPG.data", 1, 6, "DATA");

        statusEl.textContent = "Fetching framework...";
        setProgress(0);
        const frameworkUrl = await fetchScriptAsUrl(BASE + "Build/PPG.framework.js");

        statusEl.textContent = "Loading engine...";
        setProgress(0);
        await fetchAndRunScript(BASE + "Build/PPG.loader.js");

        statusEl.textContent = "Initializing...";
        setProgress(0);

        createUnityInstance(canvas, {
            dataUrl,
            frameworkUrl,
            codeUrl: wasmUrl,
            streamingAssetsUrl: BASE + "StreamingAssets",
            companyName: "Studio Minus",
            productName: "People Playground",
            productVersion: "0"
        }, (progress) => {
            setProgress(progress * 100);
            statusEl.textContent = "Initializing... " + Math.floor(progress * 100) + "%";
        }).then(() => {
            loader.style.display = "none";
            unityContainer.style.display = "block";
        }).catch(err => {
            statusEl.textContent = "❌ Unity failed: " + err;
        });

    } catch (err) {
        statusEl.textContent = "❌ Error: " + err.message;
    }
}

start();
</script>

</body>
</html>
