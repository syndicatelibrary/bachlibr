<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://raw.githubusercontent.com/genizy/web-port/main/people-playground/">
    <meta charset="utf-8">
    <title>People Playground</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    font-family: monospace;
    color: #fff;
    overflow: hidden;

    /* disable text/image selection + highlight */
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 300px;
}

#loader img {
    width: 120px;
    border-radius: 0;
    margin-bottom: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    pointer-events: none;
}

#status {
    font-size: 14px;
    margin-bottom: 10px;
    color: #aaa;
}

#progress-container {
    width: 100%;
    height: 10px;
    background: #000;
    border-radius: 0;
    overflow: hidden;
}

#progress-bar {
    height: 100%;
    width: 0%;
    background: #ffffff;
    border-radius: 0;
    transition: width 0.2s ease;
}

#percent {
    margin-top: 8px;
    font-size: 13px;
    color: #ccc;
}

#unity-container {
    width: 100%;
    height: 100%;
    display: none;
}

canvas {
    width: 100%;
    height: 100%;
    outline: none;
}
    </style>
</head>

<body>

<div id="loader">
    <img src="https://raw.githubusercontent.com/mcmattyobriore/source/main/people-playground/icon.jpeg">
    <div id="status">Starting...</div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="percent">0%</div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<script>
const statusEl = document.getElementById("status");
const bar = document.getElementById("progress-bar");
const percentEl = document.getElementById("percent");
const loader = document.getElementById("loader");
const unityContainer = document.getElementById("unity-container");
const canvas = document.getElementById("unity-canvas");

function setProgress(p) {
    bar.style.width = p + "%";
    percentEl.textContent = Math.floor(p) + "%";
}

async function fetchWithProgress(url, label) {
    statusEl.textContent = label;

    const res = await fetch(url);
    if (!res.ok) throw new Error(url + " (" + res.status + ")");

    const reader = res.body.getReader();
    const contentLength = +res.headers.get('Content-Length') || 0;

    let received = 0;
    let chunks = [];

    while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        chunks.push(value);
        received += value.length;

        if (contentLength) {
            let percent = (received / contentLength) * 100;
            setProgress(percent);
        }
    }

    setProgress(100);
    return new Blob(chunks);
}

async function mergeParts(parts, label) {
    let blobs = [];

    for (let i = 0; i < parts.length; i++) {
        statusEl.textContent = `${label} (${i+1}/${parts.length})`;
        setProgress(0);

        let blob = await fetchWithProgress(parts[i], `Loading ${parts[i]}`);
        blobs.push(blob);
    }

    statusEl.textContent = `Merging ${label}...`;
    setProgress(100);

    return URL.createObjectURL(new Blob(blobs));
}

function getParts(file, start, end) {
    let arr = [];
    for (let i = start; i <= end; i++) {
        arr.push(file + ".part" + i);
    }
    return arr;
}

async function start() {
    try {
        const wasmUrl = await mergeParts(getParts("Build/PPG.wasm",1,3),"WASM");
        const dataUrl = await mergeParts(getParts("Build/PPG.data",1,6),"DATA");

        statusEl.textContent = "Loading engine...";
        setProgress(0);

        let script = document.createElement("script");
        script.src = "Build/PPG.loader.js";

        script.onload = () => {
            createUnityInstance(canvas, {
                dataUrl,
                frameworkUrl: "Build/PPG.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Studio Minus",
                productName: "People Playground",
                productVersion: "0"
            }, (progress) => {
                setProgress(progress * 100);
                statusEl.textContent = "Initializing...";
            }).then(() => {
                loader.style.display = "none";
                unityContainer.style.display = "block";
            }).catch(err => {
                statusEl.textContent = "❌ Unity failed: " + err;
            });
        };

        script.onerror = () => {
            statusEl.textContent = "❌ Failed to load loader script";
        };

        document.body.appendChild(script);

    } catch (err) {
        statusEl.textContent = "❌ Error: " + err.message;
    }
}

start();
</script>

</body>
</html>
